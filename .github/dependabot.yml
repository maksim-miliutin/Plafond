version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # The Node types follow the Node major in .nvmrc; a newer major describes APIs the runtime does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
